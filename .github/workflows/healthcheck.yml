name: Health Check MEC

# Solução TEMPORÁRIA para ver o painel funcionando sem precisar de um
# servidor próprio. O GitHub Actions não garante cron de 1 minuto, então
# aqui rodamos a cada 5 minutos (mínimo prático) e, mesmo assim, o
# agendador é "melhor esforço": execuções podem atrasar ou ser puladas.
# Por isso esta demo NÃO serve para apurar glosa — o painel mostra a
# cobertura real dos dados justamente para deixar isso explícito. Quando o
# servidor/VM definitivo estiver pronto, use o daemon + systemd (ver
# README.md) para ter checagem de 1 em 1 minuto de verdade.
#
# Requer, uma única vez, em Settings do repositório:
#   Pages > Build and deployment > Source = "GitHub Actions"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: healthcheck-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Testes da aritmética de SLA
        run: PYTHONPATH=src python -m pytest tests/ -q

      # O histórico fica em cache, não em commits: um banco SQLite é binário,
      # então commitá-lo a cada 5 min faria o repositório crescer sem limite e
      # qualquer execução concorrente daria conflito de merge irreconciliável
      # (perdendo os dados daquela rodada em silêncio).
      - name: Restaura o histórico de checagens
        uses: actions/cache@v4
        with:
          path: data
          key: healthcheck-db-${{ github.run_id }}
          restore-keys: healthcheck-db-

      - name: Roda a checagem dos sistemas
        run: PYTHONPATH=src python -m healthcheck.daemon --once

      - name: Gera o painel HTML
        run: PYTHONPATH=src python -m healthcheck.report --output site/index.html

      - name: Sobe o painel como artifact do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
