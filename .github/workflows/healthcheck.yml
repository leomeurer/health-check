name: Health Check MEC

# Solução TEMPORÁRIA para ver o painel funcionando sem precisar de um
# servidor próprio. O GitHub Actions não garante cron de 1 minuto, então
# aqui rodamos a cada 5 minutos (mínimo prático). Quando o servidor/VM
# definitivo estiver pronto, use o daemon + systemd (ver README.md) para
# ter checagem de 1 em 1 minuto de verdade.
#
# Requer, uma única vez, em Settings do repositório:
#   1. Actions > General > Workflow permissions = "Read and write permissions"
#      (necessário para o workflow commitar os dados coletados de volta)
#   2. Pages > Build and deployment > Source = "GitHub Actions"
#      (necessário para publicar o painel em https://<usuario>.github.io/<repo>/)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: healthcheck-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Roda a checagem dos sistemas
        run: PYTHONPATH=src python -m healthcheck.daemon --once --config config.example.yaml

      - name: Gera o painel HTML
        run: PYTHONPATH=src python -m healthcheck.report --config config.example.yaml --output site/index.html

      - name: Sobe o painel como artifact do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Salva o histórico de checagens no repositório
        run: |
          git config user.name "healthcheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/healthcheck.db
          git diff --cached --quiet && echo "Sem mudanças no banco" || git commit -m "chore: atualiza dados de health check [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
