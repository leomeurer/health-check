name: Health Check MEC

# Serviu como demo temporária até a VM definitiva (Oracle Cloud Always
# Free, ver README.md) entrar no ar com checagem de 1 em 1 minuto de
# verdade via systemd. O agendamento automático (`schedule`) foi
# DESATIVADO em 19/09/2026 porque a VM passou a ser a fonte de verdade —
# o cron daqui era "melhor esforço" e não servia para apurar glosa.
#
# Mantido apenas `workflow_dispatch` para rodar manualmente se precisar
# testar o pipeline de novo no futuro.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: healthcheck-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Testes da aritmética de SLA
        run: PYTHONPATH=src python -m pytest tests/ -q

      # O histórico fica em cache, não em commits: um banco SQLite é binário,
      # então commitá-lo a cada 5 min faria o repositório crescer sem limite e
      # qualquer execução concorrente daria conflito de merge irreconciliável
      # (perdendo os dados daquela rodada em silêncio).
      - name: Restaura o histórico de checagens
        uses: actions/cache@v4
        with:
          path: data
          key: healthcheck-db-${{ github.run_id }}
          restore-keys: healthcheck-db-

      - name: Roda a checagem dos sistemas
        run: PYTHONPATH=src python -m healthcheck.daemon --once

      - name: Gera o painel HTML
        run: PYTHONPATH=src python -m healthcheck.report --output site/index.html

      - name: Sobe o painel como artifact do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
