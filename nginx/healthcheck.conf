# Serve o painel estático (data/report.html) em HTTP público, sem
# autenticação — decisão registrada com o solicitante.
#
# Instalar em /etc/nginx/sites-available/healthcheck.conf e linkar em
# sites-enabled (ver passo a passo no README).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/health-check/data;

    # Lista branca: só o painel e a biblioteca de gráficos saem daqui. Antes
    # havia uma lista negra de extensões (.db, .db-journal) que deixava
    # passar os arquivos do modo WAL do SQLite (healthcheck.db-wal/-shm),
    # expondo as checagens mais recentes para download.
    location = / {
        try_files /report.html =404;
        # Evita cachear agressivamente: o arquivo é regerado a cada poucos
        # minutos e o navegador do celular não deve mostrar uma versão velha.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /report.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ECharts (~1 MB): só muda quando a versão versionada no repositório
    # muda, então o navegador pode revalidar em vez de baixar de novo.
    location = /echarts.min.js {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 404;
    }
}
