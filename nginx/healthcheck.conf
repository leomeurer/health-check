# Serve o painel estático em HTTP, sem autenticação. Para dados que não
# devam ser públicos, adicione HTTPS e/ou autenticação.
#
# Instalar em /etc/nginx/sites-available/healthcheck.conf e linkar em
# sites-enabled (ver passo a passo no README).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # O painel é gerado em /var/www/healthcheck (ver
    # systemd/healthcheck-report.service); o banco fica em outro diretório,
    # fora do alcance do nginx.
    root /var/www/healthcheck;

    server_tokens off;
    autoindex off;

    # Cabeçalhos de segurança. Ficam no nível do server e os locations não usam
    # add_header (usam `expires`), senão o nginx descartaria estes.
    # A CSP não permite script inline: o gráfico vem de heatmap.js.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Só leitura: qualquer outro método recebe 405.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Lista branca: só o painel e seus scripts saem daqui.
    location = / {
        try_files /report.html =404;
        # Regerado a cada 5 minutos: o navegador revalida sempre.
        expires -1;
    }

    location = /report.html {
        expires -1;
    }

    location = /heatmap.js {
        expires -1;
    }

    # ECharts (~1 MB) só muda quando a versão do repositório muda.
    location = /echarts.min.js {
        expires 1d;
    }

    location / {
        return 404;
    }
}
