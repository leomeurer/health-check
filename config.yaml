# Configuração do monitoramento: o que é medido e com qual meta.
#
# Credenciais nunca entram aqui: em produção, a connection string do banco
# vem da variável de ambiente HEALTHCHECK_DB_URL (ver
# systemd/healthcheck.service), que tem precedência sobre `database.url`.

# --- Banco de dados -------------------------------------------------------
# SQLite em arquivo local por padrão. Para outro banco suportado pelo
# SQLAlchemy, use a connection string correspondente, por exemplo:
#   oracle+oracledb://usuario:senha@host:1521/?service_name=ORCLPDB1
# (requer `pip install oracledb`).
database:
  url: "sqlite:///data/healthcheck.db"

# --- Checagem ---------------------------------------------------------
check:
  interval_seconds: 60      # intervalo entre rodadas de checagem
  timeout_seconds: 10       # timeout HTTP por endpoint (menor que o intervalo)
  # Uma única falha já conta como indisponibilidade (sem tolerância de
  # N falhas consecutivas).

# --- SLA ----------------------------------------------------------------
# O painel compara o uptime de cada mês com esta meta. O valor financeiro
# de eventual glosa não é calculado: depende da cláusula de cada contrato.
sla:
  target_pct: 98.0          # meta de disponibilidade mensal, em %
  window: "monthly"         # janela de apuração: "monthly" (mês calendário) é a única suportada
  timezone: "America/Sao_Paulo"  # fuso do contrato: define onde começa/termina o mês apurado
  glosa_formula: null       # reservado; não utilizado

# --- Sistemas monitorados ----------------------------------------------
# key: identificador curto e estável (não mude depois de começar a
#      coletar dados, senão o histórico daquele sistema se divide em dois).
# name: nome de exibição no painel.
# short_name: (opcional) nome curto do sistema no gráfico mensal.
# url: endpoint a ser checado (GET).
# expected_status: (opcional) lista dos códigos HTTP que contam como "no ar".
#      Se omitido, aceita qualquer código de 200 a 399. Se informado, SOMENTE
#      os códigos listados são aceitos — ex: [200, 302] não aceita 301.
# also_accept: (opcional) códigos extras aceitos ALÉM da regra acima. O painel
#      sinaliza esses endpoints, para a apuração ficar auditável.
# label: (opcional) rótulo do endpoint principal no painel. Padrão: "Página inicial".
# extra_checks: (opcional) outros endpoints do MESMO sistema (ex: a API por trás
#      da página). Cada um tem key, label, url e os mesmos expected_status /
#      also_accept. O sistema só conta como "no ar" numa rodada se TODOS
#      responderam OK — a página inicial pode vir de um cache/CDN enquanto a
#      API está fora.
#
# Cloudflare: e-MEC, Sistec, SIMEC, GPEI, MEC Idiomas e Mais Professores
# ficam atrás do desafio anti-bot do Cloudflare (403 com
# "cf-mitigated: challenge"), respondido na borda sem a requisição chegar ao
# sistema. O monitor registra essas rodadas como "bloqueio_cloudflare" (sem
# medição) — não é preciso configurar nada por endpoint. Quando o monitor for
# liberado no Cloudflare, as respostas reais passam a contar automaticamente.
targets:
  # --- Prioritários: primeiros da lista (e do painel) ---------------------
  - key: mec_livros
    name: "MEC Livros (Biblioteca Digital do MEC)"
    short_name: "MEC Livros"
    url: "https://meclivros.mec.gov.br/"
    # A página inicial é Next.js com cache (x-nextjs-cache: HIT): não passa
    # pela API. /api/backend/auth/me é repassada ao backend, que responde 401
    # (JSON do próprio backend) sem login. Se o backend cair, vira 5xx.
    extra_checks:
      - key: mec_livros_api
        label: "API (backend)"
        url: "https://meclivros.mec.gov.br/api/backend/auth/me"
        expected_status: [200, 401]

  - key: pe_de_meia
    name: "Programa Pé-de-Meia (Consulta do Estudante)"
    short_name: "Pé-de-Meia"
    url: "https://estudante.pedemeia.mec.gov.br/"
    # Sem extra_checks de propósito: a página inicial é gerada na hora pela
    # própria aplicação (uvicorn, cache-control: no-store), então checá-la
    # já testa o backend. O login depende do gov.br, monitorado à parte.

  - key: mec_enem
    name: "MEC Enem (App de preparação: simulados, redação e tira-dúvidas)"
    short_name: "MEC Enem"
    url: "https://app.mecenem.mec.gov.br/"
    # O app é um site estático (S3 + CloudFront): a página inicial não diz
    # nada sobre o backend. /health é o health check da API principal
    # (.NET): responde 200 para Healthy/Degraded e 503 para Unhealthy.
    extra_checks:
      - key: mec_enem_api
        label: "API principal (health check)"
        url: "https://api-core.mecenem.mec.gov.br/health"

  - key: gpe
    name: "MEC Gestão Presente na Escola (GPE)"
    short_name: "GPE"
    url: "https://gpe.gestaopresente.mec.gov.br/"
    # A página inicial é Next.js pré-gerada (s-maxage de 1 ano): continua
    # respondendo 200 mesmo com o backend fora. A API é o que o navegador
    # chama depois; sem login ela responde 401 do próprio Django.
    extra_checks:
      - key: gpe_api
        label: "API (backend)"
        url: "https://api.gpe.gestaopresente.mec.gov.br/backend/api/"
        expected_status: [200, 401]

  # mec_idiomas e mais_professores: atrás do desafio do Cloudflare (ver acima).
  - key: mec_idiomas
    name: "MEC Idiomas"
    short_name: "MEC Idiomas"
    url: "https://mecidiomas.mec.gov.br/slides"

  - key: mais_professores
    name: "Programa Mais Professores"
    short_name: "Mais Professores"
    url: "https://maisprofessores.mec.gov.br/"

  # --- Demais sistemas ----------------------------------------------------
  - key: acesso_unico
    name: "Portal Único de Acesso ao Ensino Superior (SiSU/ProUni/FIES)"
    short_name: "Acesso Único"
    url: "https://acessounico.mec.gov.br/"

  - key: emec
    name: "e-MEC (Regulação da Educação Superior)"
    short_name: "e-MEC"
    url: "https://emec.mec.gov.br/"

  - key: sistec
    name: "Sistec (Sistema de Informações Técnicas)"
    short_name: "Sistec"
    url: "https://sistec.mec.gov.br/"

  - key: simec
    name: "SIMEC (Monitoramento, Execução e Controle)"
    short_name: "SIMEC"
    url: "https://simec.mec.gov.br/"

  - key: gpei
    name: "MEC Gestão Presente na Educação Infantil (GPEI)"
    short_name: "GPEI"
    url: "https://gpei.mec.gov.br/"

  - key: inep_portal
    name: "Portal de Sistemas do Inep (Enem, Enade, etc.)"
    short_name: "Portal Inep"
    # Portal institucional do Inep no gov.br.
    url: "https://www.gov.br/inep/pt-br"

  - key: mec_portal
    name: "Página Oficial do Ministério da Educação (MEC/Gov.br)"
    short_name: "Portal MEC"
    url: "https://www.gov.br/mec/pt-br"

  - key: avamec
    name: "Ambiente Virtual de Aprendizagem (AVAMEC)"
    short_name: "AVAMEC"
    url: "https://avamec.mec.gov.br/"

  # Dependência externa: boa parte dos sistemas acima usa o login unificado
  # do gov.br. Se ele cair, novos logins falham mesmo com os sistemas no ar.
  - key: acesso_govbr
    name: "Provedor de Identidade Gov.br (Autenticação Unificada) — dependência SSO"
    short_name: "Login gov.br"
    url: "https://acesso.gov.br"
