# Configuração do monitoramento. Este arquivo é versionado de propósito:
# ele define O QUE é medido e COM QUAL META, que é justamente o que precisa
# ficar rastreável para sustentar a apuração contratual.
#
# Credenciais NUNCA entram aqui: a connection string do Oracle é passada
# pela variável de ambiente HEALTHCHECK_DB_URL (ver systemd/healthcheck.service).

# --- Banco de dados -------------------------------------------------------
# Para os testes iniciais, deixe como está (SQLite em arquivo local).
# Para produção, troque pela connection string do Oracle, por exemplo:
#   oracle+oracledb://usuario:senha@host:1521/?service_name=ORCLPDB1
# (requer `pip install oracledb`). O restante do código não muda,
# pois usa SQLAlchemy como camada de abstração.
database:
  url: "sqlite:///data/healthcheck.db"

# --- Checagem ---------------------------------------------------------
check:
  interval_seconds: 60      # intervalo entre rodadas de checagem
  timeout_seconds: 10       # timeout HTTP por sistema
  # Critério de queda: 1 falha já conta como início de indisponibilidade
  # (decisão registrada para fins de apuração de SLA/glosa).

# --- SLA / Glosa contratual --------------------------------------------
# O painel compara o uptime do mês corrente contra esta meta e marca cada
# sistema como cumprido / não cumprido. O VALOR da glosa não é calculado:
# depende da cláusula contratual, que ainda não foi repassada.
sla:
  target_pct: 98.0          # meta de disponibilidade mensal, em %
  window: "monthly"         # janela de apuração: "monthly" (mês calendário) é a única suportada hoje
  timezone: "America/Sao_Paulo"  # fuso do contrato: define onde começa/termina o mês apurado
  # Fórmula de glosa é específica de cada contrato. Quando você tiver a
  # cláusula, me avise para implementarmos o cálculo exato aqui
  # (ex: percentual sobre o valor da fatura, faixas de desconto, etc.).
  glosa_formula: null

# --- Sistemas monitorados ----------------------------------------------
# key: identificador curto e estável (não mude depois de começar a
#      coletar dados, senão o histórico daquele sistema "quebra" em dois).
# name: nome de exibição no painel.
# url: endpoint a ser checado (GET).
# expected_status: (opcional) lista dos códigos HTTP que contam como "no ar".
#      Se omitido, aceita qualquer código de 200 a 399. Se informado, SOMENTE
#      os códigos listados são aceitos — ex: [200, 302] não aceita 301.
# also_accept: (opcional) códigos extras aceitos ALÉM da regra acima. O painel
#      marca esses alvos, para a apuração de SLA ficar auditável.
# label: (opcional) rótulo do endpoint principal no painel. Padrão: "Página inicial".
# extra_checks: (opcional) outros endpoints do MESMO sistema (ex: a API por trás
#      da página). Cada um tem key, label, url e os mesmos expected_status /
#      also_accept. O painel mostra todos no bloco do sistema, e o sistema só
#      conta como "no ar" numa rodada se TODOS responderam OK. Motivo: a página
#      inicial pode vir pronta de um cache/CDN enquanto a API está fora, e é
#      essa queda que o usuário sente (caso real: GPE, 23/09/2026).
#
# BLOQUEIO CLOUDFLARE (reavaliado em 25/09/2026) — emec, sistec, simec, gpei,
# mec_idiomas e mais_professores ficam atrás do desafio anti-bot do
# Cloudflare: ele responde 403 com "cf-mitigated: challenge" ("Just a
# moment...") a QUALQUER cliente que não seja navegador — testado da VM da
# Oracle e da rede da UFSC/RNP, então não é bloqueio só de IP de nuvem.
# Essa resposta vem da borda do Cloudflare, sem a requisição chegar ao
# sistema: não prova que ele está no ar nem fora.
#
# (Em 19/09 os 4 primeiros foram tratados como "403 do próprio servidor"
# com `also_accept: [403]`; o diagnóstico estava errado e isso fazia o
# painel mostrar "no ar" sem medição nenhuma.)
#
# DECISÃO (25/09/2026): o checker reconhece o desafio pelo cabeçalho e
# grava a rodada como "bloqueio_cloudflare" — nem no ar, nem fora; fica
# fora do uptime e derruba a cobertura. Nada é configurado por alvo:
# quando o MEC liberar o monitor no Cloudflare (regra "Skip" para o IP
# 157.151.7.222 ou um cabeçalho secreto), as respostas reais passam a
# contar sozinhas. O histórico com 403 desses alvos foi reclassificado
# como bloqueio (python -m healthcheck.reclassify_cloudflare).
targets:
  # --- Prioritários: primeiros da lista (e do painel) ---------------------
  # Incluídos em 25/09/2026. Títulos/descrições tirados das próprias páginas,
  # exceto onde indicado. Testados no mesmo dia: os 4 primeiros respondem
  # 200; mec_idiomas e mais_professores caem no desafio do Cloudflare.
  - key: mec_livros
    name: "MEC Livros (Biblioteca Digital do MEC)"
    url: "https://meclivros.mec.gov.br/"
    # A página inicial é Next.js com cache (x-nextjs-cache: HIT): não passa
    # pela API. /api/backend/auth/me é repassada ao backend, que responde 401
    # (JSON do próprio backend) sem login. Se o backend cair, vira 5xx.
    extra_checks:
      - key: mec_livros_api
        label: "API (backend)"
        url: "https://meclivros.mec.gov.br/api/backend/auth/me"
        expected_status: [200, 401]

  - key: pe_de_meia
    name: "Programa Pé-de-Meia (Consulta do Estudante)"
    url: "https://estudante.pedemeia.mec.gov.br/"
    # Sem extra_checks de propósito: a página inicial é gerada na hora pela
    # própria aplicação (uvicorn, cache-control: no-store), então checá-la
    # já testa o backend. O login depende do gov.br, monitorado à parte.

  - key: mec_enem
    name: "MEC Enem (App de preparação: simulados, redação e tira-dúvidas)"
    url: "https://app.mecenem.mec.gov.br/"
    # O app é um site estático (S3 + CloudFront): a página inicial não diz
    # nada sobre o backend. /health é o health check da API principal
    # (.NET): responde 200 para Healthy/Degraded e 503 para Unhealthy.
    extra_checks:
      - key: mec_enem_api
        label: "API principal (health check)"
        url: "https://api-core.mecenem.mec.gov.br/health"

  # Já era monitorado; só mudou de posição. A key continua "gpe" para
  # não quebrar o histórico.
  - key: gpe
    name: "MEC Gestão Presente na Escola (GPE)"
    url: "https://gpe.gestaopresente.mec.gov.br/"
    # A página inicial é Next.js pré-gerada (s-maxage de 1 ano): continua
    # respondendo 200 mesmo com o backend fora. A API é o que o navegador
    # chama depois; sem login ela responde 401 do próprio Django.
    extra_checks:
      - key: gpe_api
        label: "API (backend)"
        url: "https://api.gpe.gestaopresente.mec.gov.br/backend/api/"
        expected_status: [200, 401]

  # mec_idiomas e mais_professores: bloqueio Cloudflare (ver cabeçalho).
  - key: mec_idiomas
    name: "MEC Idiomas"   # <title> da página: "MEC idiomas"
    url: "https://mecidiomas.mec.gov.br/slides"

  - key: mais_professores
    name: "Programa Mais Professores"
    url: "https://maisprofessores.mec.gov.br/"

  # --- Demais sistemas ----------------------------------------------------
  - key: acesso_unico
    name: "Portal Único de Acesso ao Ensino Superior (SiSU/ProUni/FIES)"
    url: "https://acessounico.mec.gov.br/"

  - key: emec
    name: "e-MEC (Regulação da Educação Superior)"
    url: "https://emec.mec.gov.br/"

  - key: sistec
    name: "Sistec (Sistema de Informações Técnicas)"
    url: "https://sistec.mec.gov.br/"

  - key: simec
    name: "SIMEC (Monitoramento, Execução e Controle)"
    url: "https://simec.mec.gov.br/"

  - key: gpei
    name: "MEC Gestão Presente na Educação Infantil (GPEI)"
    url: "https://gpei.mec.gov.br/"

  - key: inep_portal
    name: "Portal de Sistemas do Inep (Enem, Enade, etc.)"
    # A URL informada (https://inep.gov.br) não resolve DNS (domínio
    # inexistente). O endereço real do portal do Inep dentro do gov.br é
    # este abaixo — confirme se é o sistema/página certa antes de contar
    # com ela para o SLA.
    url: "https://www.gov.br/inep/pt-br"

  # Educacenso (Censo Escolar) foi informado com a mesma URL genérica do
  # Inep acima. Se o Educacenso tiver uma URL própria (ex: um subdomínio
  # de login/sistema), me passe o endereço específico para eu adicionar
  # como um alvo separado — hoje o item "inep_portal" já cobre o portal
  # institucional, mas não substitui o monitoramento do sistema em si.
  # - key: educacenso
  #   name: "Educacenso (Sistema do Censo Escolar)"
  #   url: "https://TROCAR-PELA-URL-ESPECIFICA-DO-SISTEMA"

  - key: mec_portal
    name: "Página Oficial do Ministério da Educação (MEC/Gov.br)"
    url: "https://www.gov.br/mec/pt-br"

  - key: avamec
    name: "Ambiente Virtual de Aprendizagem (AVAMEC)"
    url: "https://avamec.mec.gov.br/"

  # Dependência crítica externa: quase todos os sistemas acima dependem do
  # login unificado do gov.br. Se ele cair, os portais do MEC ficam
  # inacessíveis para novos logins mesmo estando "no ar" tecnicamente —
  # por isso ele entra na mesma árvore de monitoramento.
  - key: acesso_govbr
    name: "Provedor de Identidade Gov.br (Autenticação Unificada) — dependência SSO"
    url: "https://acesso.gov.br"
